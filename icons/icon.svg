<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícono de la app RedMoviSim (PWA): fondo oscuro, logo centrado dentro de la
       zona segura de los íconos "maskable" (círculo del 80 %) y franja con los
       colores de las 7 líneas del metro más el rojo de los buses.
       Los PNG de esta carpeta se generan desde aquí. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2433"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 226) scale(1.36) translate(-100 -65)">
    <rect x="6" y="6" width="188" height="118" rx="30" fill="#d7262e"/>
    <path d="M30 94H78L122 36H170" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 18V112" fill="none" stroke="#ffd2d5" stroke-width="9" stroke-linecap="round" stroke-dasharray="0.1 17"/>
    <circle cx="30" cy="94" r="10" fill="#fff"/>
    <circle cx="170" cy="36" r="10" fill="#fff"/>
    <circle cx="100" cy="65" r="17" fill="#fff"/>
    <circle cx="100" cy="65" r="8" fill="#d7262e"/>
  </g>
  <g transform="translate(116 350)">
    <rect x="0" width="35" height="14" rx="3" fill="#e1251b"/>
    <rect x="35" width="35" height="14" fill="#f4b400"/>
    <rect x="70" width="35" height="14" fill="#8b5a2b"/>
    <rect x="105" width="35" height="14" fill="#1d3f95"/>
    <rect x="140" width="35" height="14" fill="#3c86c6"/>
    <rect x="175" width="35" height="14" fill="#00965e"/>
    <rect x="210" width="35" height="14" fill="#9b26b6"/>
    <rect x="245" width="35" height="14" rx="3" fill="#ffffff"/>
  </g>
</svg>
