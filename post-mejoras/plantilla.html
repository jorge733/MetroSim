<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:var(--w);height:var(--h);overflow:hidden}
body{font-family:"DejaVu Sans","Liberation Sans",Arial,sans-serif;color:#fff;
 background:radial-gradient(ellipse at 50% 30%,#26324a 0%,#111722 55%,#05070a 100%);position:relative}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px;gap:var(--gap)}
.logo{width:var(--logo);display:var(--logod,block)}
h1{font-size:var(--h1);font-weight:900;line-height:1;letter-spacing:-.02em}
h1 em{font-style:normal;color:#f4b400;display:block;font-size:.55em;letter-spacing:.06em;margin-top:16px}
.badge{display:inline-flex;align-items:center;gap:14px;background:#d7262e;padding:12px 30px;border-radius:999px;font-weight:800;font-size:var(--badge);letter-spacing:.08em}
p{font-size:var(--p);line-height:1.35;color:#d6dbe6;max-width:900px}
p b{color:#fff}
.route{position:relative;width:var(--rw,820px);margin:6px 0}
.route .bar{position:absolute;left:4%;right:4%;top:calc(var(--dot) / 2 - 6px);height:12px;border-radius:6px;
 background:linear-gradient(90deg,#00965e 0 30%,#f4b400 30% 100%)}
.route .bar:after{content:"";position:absolute;left:30%;right:0;top:0;bottom:0;
 background:repeating-linear-gradient(90deg,transparent 0 18px,#111722 18px 30px)}
.stops{position:relative;display:flex;justify-content:space-between}
.stop{width:25%;display:flex;flex-direction:column;align-items:center;gap:12px}
.stop i{width:var(--dot);height:var(--dot);border-radius:50%;background:#111722;border:6px solid #f4b400}
.stop.on i{background:#fff;border-color:#00965e;box-shadow:0 0 0 6px rgba(0,150,94,.35)}
.stop span{font-size:var(--stop);font-weight:700;color:#9fb0c8;line-height:1.2}
.stop.on span{color:#fff}
.url{font-size:var(--url);color:#9fb0c8;letter-spacing:.04em;font-weight:700}
.board{font-family:"DejaVu Sans Mono",monospace;background:#000;border:3px solid #333;border-radius:10px;padding:12px 26px;color:#ffb000;font-size:var(--board);letter-spacing:.08em;text-shadow:0 0 8px #ff9000}
</style></head><body>
<div class="wrap">
 <svg class="logo" viewBox="0 0 200 130"><rect x="6" y="6" width="188" height="118" rx="30" fill="#d7262e"/>
 <path d="M30 94H78L122 36H170" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M100 18V112" fill="none" stroke="#ffd2d5" stroke-width="9" stroke-linecap="round" stroke-dasharray="0.1 17"/>
 <circle cx="30" cy="94" r="10" fill="#fff"/><circle cx="170" cy="36" r="10" fill="#fff"/>
 <circle cx="100" cy="65" r="17" fill="#fff"/><circle cx="100" cy="65" r="8" fill="#d7262e"/></svg>
 <div class="badge">🚇 RedMoviSim</div>
 <h1>Ya está en<br>marcha<em>Y ESTO RECIÉN EMPIEZA</em></h1>
 <div class="route"><div class="bar"></div><div class="stops">
  <div class="stop on"><i></i><span>Funcional</span></div>
  <div class="stop"><i></i><span>Mejoras</span></div>
  <div class="stop"><i></i><span>Más real</span></div>
  <div class="stop"><i></i><span>Experiencia<br>única</span></div>
 </div></div>
 <p>Sé que todavía tiene mucho por mejorar, pero <b>ya es funcional</b>.<br>
 Poco a poco le iré haciendo mejoras para que se sienta <b>cada vez más real</b>.</p>
 <div class="board">PRÓXIMA ESTACIÓN: MEJORAS</div>
 <div class="url">redmovisim.cl</div>
</div>
</body></html>
